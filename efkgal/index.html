const cv=document.getElementById('cv'),W=innerWidth-220,H=innerHeight;

const cam=new THREE.PerspectiveCamera(40,W/H,.5,1000);let CR=34,CY=.55,CA=0;function camUp(){cam.position.set(Math.sin(CA)*CR*Math.cos(CY),CR*Math.sin(CY),Math.cos(CA)*CR*Math.cos(CY));cam.lookAt(0,3,0)}camUp();

window.playN=function(n,sc){document.getElementById('nm').textContent=n;[...document.querySelectorAll('#ls div')].forEach(d=>d.classList.toggle('on',d.dataset.n===n));ST.name=n;load(n,e=>{ctx.stopAll();cur=ctx.play(e,0,0,0);if(sc)cur.setScale(sc,sc,sc);ST.t0=performance.now()})};
let drag=null;cv.onmousedown=e=>drag=[e.clientX,e.clientY];onmouseup=()=>drag=null;onmousemove=e=>{if(!drag)return;CA-=(e.clientX-drag[0])*.01;CY=Math.max(.05,Math.min(1.5,CY+(e.clientY-drag[1])*.01));drag=[e.clientX,e.clientY];camUp()};cv.onwheel=e=>{CR*=e.deltaY>0?1.1:.9;camUp()};

 const ls=document.getElementById('ls');for(const n of EFF){const d=document.createElement('div');d.dataset.n=n;d.textContent=n.replace(/^Sample\//,'').replace(/\.efk$/,'');d.onclick=()=>playN(n);ls.appendChild(d)}window.READY=1;
 let last=performance.now();(function loop(){requestAnimationFrame(loop);const t=performance.now();ctx.update(Math.min(4,(t-last)/1000*60*SPD));last=t;
  if(LOOP&&cur&&!cur.exists&&ST.name){playN(ST.name)}
  R.render(S,cam);ctx.setProjectionMatrix(cam.projectionMatrix.elements);ctx.setCameraMatrix(cam.matrixWorldInverse.elements);ctx.draw();R.resetState()})()},()=>{document.body.append('wasm load failed');ST.fail=1});

window.__sheet=async function(names,frames,cw){LOOP=0;SPD=0;cw=cw||240;const ch=Math.round(cw*H/W);const cols=frames.length;let sh=document.getElementById('sheet');if(!sh){sh=document.createElement('canvas');sh.id='sheet';sh.style.cssText='position:fixed;left:0;top:0;z-index:9;background:#000';document.body.appendChild(sh)}sh.width=cw*cols;sh.height=ch*names.length;const g=sh.getContext('2d');g.fillStyle='#000';g.fillRect(0,0,sh.width,sh.height);
for(let r=0;r<names.length;r++){const n=names[r].startsWith('Sample/')?names[r]:EFF.find(x=>x.includes('/'+names[r]+'.efk'));await new Promise(res=>load(n,res));const e=eff[n];ctx.stopAll();ctx.play(e,0,0,0);let f=0;ctx.update(0);
 for(let c=0;c<cols;c++){const tf=frames[c];ctx.update(tf-f);f=tf;R.render(S,cam);ctx.setProjectionMatrix(cam.projectionMatrix.elements);ctx.setCameraMatrix(cam.matrixWorldInverse.elements);ctx.draw();R.resetState();g.drawImage(cv,c*cw,r*ch,cw,ch)}
 g.fillStyle='#ff0';g.font='bold 14px sans-serif';g.fillText(n.replace(/^Sample\//,'').replace('.efk',''),4,r*ch+16);for(let c=0;c<cols;c++){g.fillText(frames[c],c*cw+cw-30,r*ch+ch-6)}}

window.__hide=()=>{const s=document.getElementById('sheet');if(s)s.style.display='none';LOOP=1;SPD=1};
window.__cam=(r,y,a)=>{CR=r;CY=y;CA=a||0;camUp()};
