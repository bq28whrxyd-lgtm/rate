<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>圧縮アリーナ 試作</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+1p:wght@500;800;900&family=M+PLUS+Rounded+1c:wght@800;900&family=RocknRoll+One&family=Oxanium:wght@600;800&family=Cinzel:wght@700;900&family=Shippori+Mincho+B1:wght@700;800&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap">
<style>
/* 縦画面いっぱいの1画面ゲーム。上=状態、中央=アリーナ、下=4人と共有HP・バースト */
:root{
  --ink:#eaf3ff; --dim:#8fa6c8; --night:#060b1a; --deep:#0b1633;
  --cyan:#5fe4ff; --gold:#ffd36a; --red:#ff5468; --green:#6dffa6;
  --ui:"M PLUS 1p","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;
  --num:"Oxanium","M PLUS 1p",system-ui,sans-serif;
  --cin:"Cinzel","Times New Roman",serif;
  --gold-line:linear-gradient(180deg,#fff4c8 0%,#f0c860 28%,#a7731f 62%,#f3d27a 100%);
  --navy:linear-gradient(180deg,#26346a 0%,#141d44 48%,#0b112c 100%);
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--night);color:var(--ink);overflow:hidden;overscroll-behavior:none}
body{font-family:var(--ui);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#app{position:fixed;inset:0;touch-action:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#lay{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.top{position:absolute;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 8px) max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px));display:flex;gap:8px;align-items:center;pointer-events:none}
.pill{display:flex;gap:6px;align-items:center;padding:5px 10px;border-radius:8px;background:linear-gradient(180deg,#14244acc,#0a1430cc);box-shadow:inset 0 0 0 1px #3e6db466,0 2px 8px #0008;font:800 12px var(--ui);white-space:nowrap}
.pill b{font:800 14px var(--num);color:var(--gold)}
.pill.t{color:var(--dim);font-weight:500}
.sp{flex:1}
.btn{pointer-events:auto;border:0;cursor:pointer;font:800 12px var(--ui);color:var(--ink);padding:6px 10px;border-radius:8px;background:linear-gradient(180deg,#1b3366,#0d1a3a);box-shadow:inset 0 0 0 1px #5d8fd8aa,0 2px 6px #0009}
.btn:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
#combo{position:absolute;right:max(14px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 50px);text-align:right;pointer-events:none;opacity:0;transform-origin:100% 50%;transition:opacity .25s}
#combo .n{font:800 46px/1 var(--num);color:#fff;text-shadow:0 0 14px #ffb44a,0 3px 0 #9a4a10,0 0 2px #000}
#combo .w{font:900 18px var(--ui);color:var(--gold);text-shadow:0 2px 0 #6a3a08}
#combo .s{font:800 12px var(--ui);color:#ffe6a8}
#hint{position:absolute;left:0;right:0;bottom:calc(var(--panelH,190px) + 12px);text-align:center;font:800 13px var(--ui);color:#cfe7ff;text-shadow:0 1px 3px #000;pointer-events:none;transition:opacity .3s}
#hint span{display:inline-block;padding:6px 12px;border-radius:999px;background:#08122ccc;box-shadow:inset 0 0 0 1px #4a7ac066}
.bot{position:absolute;left:0;right:0;bottom:0;padding:0 max(10px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 10px) max(10px,env(safe-area-inset-left,0px));background:linear-gradient(180deg,transparent,#050a18ee 30%);pointer-events:none}
.party{display:grid;grid-template-columns:repeat(4,1fr) 72px;gap:7px;align-items:end;padding-top:26px}
.face{pointer-events:auto;position:relative;border:0;padding:0;cursor:pointer;aspect-ratio:3/4;border-radius:10px;overflow:hidden;background:var(--deep);box-shadow:inset 0 0 0 2px #31508a,0 3px 8px #000a;transition:transform .15s}
.face .art{position:absolute;inset:0}
.face .nm{position:absolute;left:0;right:0;bottom:0;padding:3px 0 4px;font:900 12px var(--ui);text-align:center;color:#fff;background:linear-gradient(180deg,transparent,#000c);text-shadow:0 1px 2px #000}
.face .el{position:absolute;left:4px;top:4px;font:900 10px var(--ui);padding:1px 5px;border-radius:5px;background:#0009}
.face .cr{position:absolute;right:3px;top:2px;font:900 10px var(--ui);color:#1a1004;background:var(--gold);border-radius:5px;padding:1px 4px;display:none}
.face.lead .cr{display:block}
.face.turn{transform:translateY(-8px);box-shadow:inset 0 0 0 2px #fff,0 0 16px var(--cyan),0 3px 8px #000a}
.face.turn::after{content:"手番";position:absolute;left:50%;top:-1px;transform:translateX(-50%);font:900 10px var(--ui);background:var(--cyan);color:#04131c;padding:1px 6px;border-radius:0 0 6px 6px}
#burst{pointer-events:auto;border:0;cursor:pointer;width:72px;height:72px;border-radius:50%;font:900 13px var(--num);color:#fff;letter-spacing:.04em;background:radial-gradient(circle at 50% 40%,#2d5fd1,#0b1a46 70%);box-shadow:inset 0 0 0 2px #6aa8ff88,0 0 0 3px #0a1430,0 3px 10px #000b;opacity:.55;position:relative}
#burst.ready{opacity:1;box-shadow:inset 0 0 0 2px #fff,0 0 22px #5fe4ff,0 0 0 3px #0a1430;animation:bp 1s ease-in-out infinite}
#burst.on{background:radial-gradient(circle at 50% 40%,#ffd36a,#c0601a 70%);box-shadow:inset 0 0 0 2px #fff,0 0 26px #ffb44a}
@keyframes bp{50%{transform:scale(1.06)}}
.bars{display:grid;grid-template-columns:1fr 72px;gap:7px;margin-top:8px;align-items:center}
.hp{position:relative;height:18px;border-radius:9px;background:#0a1430;box-shadow:inset 0 0 0 1px #3a5f9e}
.hp i{position:absolute;left:2px;top:2px;bottom:2px;border-radius:7px;background:linear-gradient(90deg,#2bd97a,#9cff7a);transition:width .3s}
.hp i.low{background:linear-gradient(90deg,#ff3d5a,#ff9a5a)}
.hp span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:800 11px var(--num);text-shadow:0 1px 2px #000}
.bg{height:8px;border-radius:4px;background:#0a1430;box-shadow:inset 0 0 0 1px #3a5f9e;overflow:hidden}
.bg i{display:block;height:100%;width:0;background:linear-gradient(90deg,#5fe4ff,#fff);transition:width .3s}
.tag{position:absolute;left:0;top:0;transform:translate(-50%,-100%);will-change:transform;pointer-events:none;text-align:center}
.tag .hb{width:46px;height:5px;margin:0 auto;border-radius:3px;background:#200a10;box-shadow:0 0 0 1px #000a}
.tag .hb i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,#ff4a6a,#ffb07a)}
.tag .cd{display:inline-block;margin-bottom:2px;font:900 10px var(--ui);color:#fff;padding:0 5px;border-radius:5px;background:#5a0c1acc}
.tag .cd.hot{background:var(--red);box-shadow:0 0 8px var(--red)}
.tag .nm{font:800 10px var(--ui);color:#ffd9de;text-shadow:0 1px 2px #000}
.dmg{position:absolute;left:0;top:0;transform:translate(-50%,-50%);will-change:transform,opacity;font:800 18px var(--num);color:#fff;text-shadow:0 0 6px #ffa63a,0 2px 0 #7a3a08,0 0 2px #000;pointer-events:none;white-space:nowrap}
.dmg.big{font-size:24px;color:#fff2c0}
.dmg.heal{color:#b8ffd0;text-shadow:0 0 6px #2bd97a,0 2px 0 #0a5a2a}
.dmg.bad{color:#ffc0c8;text-shadow:0 0 6px #ff3d5a,0 2px 0 #6a0a18}
.dmg.txt{font:900 15px var(--ui)}
.dmg.weak{font-size:24px;color:#fff36a;text-shadow:0 0 8px #ffb000,0 2px 0 #7a4a00,0 0 2px #000}
.dmg.res{font-size:14px;color:#b8c0d8;text-shadow:0 1px 0 #000}
.dmg.grd{font:900 13px var(--ui);color:#e8eeff;text-shadow:0 0 6px #6aa8ff,0 1px 0 #000}
.tag .gm.warn{background:#a0102a;box-shadow:inset 0 0 0 1px #ff9aa0;animation:gmW .6s ease-in-out infinite alternate}@keyframes gmW{to{transform:scale(1.12)}}
.gm{display:inline-block;margin:1px 0 2px;padding:0 6px;border-radius:4px;font:900 10px var(--ui);color:#fff;background:#0b1230e6;box-shadow:inset 0 0 0 1px #e9c46a99;white-space:nowrap}
.tag .gm.e炎{background:#c8401ce6}.tag .gm.e水{background:#1c6ac8e6}.tag .gm.e木{background:#1c8a44e6}
#flash{position:absolute;inset:0;background:#ff2a44;opacity:0;pointer-events:none;transition:opacity .35s}
#dbg{position:absolute;left:max(10px,env(safe-area-inset-left,0px));top:calc(env(safe-area-inset-top,0px) + 44px);width:min(250px,64vw);padding:8px 9px;border-radius:8px;background:#000c;box-shadow:inset 0 0 0 1px #2a4a7a;font:500 10.5px/1.45 ui-monospace,Menlo,Consolas,monospace;color:#bfe3ff;pointer-events:auto;white-space:pre-wrap;max-height:46vh;overflow:auto}
#dbg .row{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
#ov{position:absolute;inset:0;display:grid;place-items:center;background:#030712aa;pointer-events:auto}
#ov .card{width:min(320px,86vw);padding:20px 18px;border-radius:14px;text-align:center;background:linear-gradient(180deg,#132650,#0a1430);box-shadow:inset 0 0 0 1px #5d8fd8aa,0 10px 30px #000c}
#ov h2{margin:0 0 6px;font:900 24px var(--ui);text-wrap:balance}
#ov p{margin:0 0 14px;color:var(--dim);font:500 13px/1.6 var(--ui)}
#ov .btn{font-size:14px;padding:10px 18px}
#rot{position:absolute;inset:0;display:none;place-items:center;text-align:center;background:var(--night);pointer-events:auto;font:800 14px var(--ui);color:var(--dim)}
@media (orientation:landscape) and (max-height:520px){#rot{display:grid}}
/* (v0.4) 共鳴技の帯・危険物の札・ラスボスの体力 */
.rsb{position:absolute;left:0;padding:6px 18px 7px max(14px,env(safe-area-inset-left,0px));border-radius:0 10px 10px 0;background:linear-gradient(90deg,var(--c) 0%,#0a1430f0 75%);box-shadow:inset 0 0 0 1px #ffffff33,0 4px 14px #000a;pointer-events:none}
.rsb small{display:block;font:800 9px var(--ui);color:#fff;opacity:.9;letter-spacing:.08em}
.rsb b{font:900 15px var(--ui);color:#fff;text-shadow:0 2px 0 #0008}
.face.rs{animation:rsf .7s ease-out}
@keyframes rsf{40%{box-shadow:inset 0 0 0 2px #fff,0 0 26px 6px #fff}}
.tag.hz span{display:inline-block;font:900 10px var(--ui);padding:1px 6px;border-radius:6px;color:#fff}
.tag .pz{background:#2f7a35dd;box-shadow:0 0 8px #6aff7a}
.tag .wd{background:#a01a2add;box-shadow:0 0 8px #ff4a5a}
.tag .bk{width:46px;height:3px;margin:2px auto 0;border-radius:2px;background:#201808;overflow:hidden}
.tag .bk i{display:block;height:100%;width:0;background:#ffd36a}
.tag.brk .nm{color:#ffd36a}
#wkt span{display:inline-block;font:900 11px var(--ui);padding:2px 8px;border-radius:6px;color:#2a1600;background:#ffc04a;box-shadow:0 0 12px #ffb040}
#lbb{position:absolute;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 44px);pointer-events:none}
.lbt{display:flex;justify-content:space-between;align-items:baseline;font:900 13px var(--ui);text-shadow:0 1px 3px #000}
.lbc{font:900 11px var(--ui);padding:1px 7px;border-radius:6px;background:#5a0c1acc}
.lbc.hot{background:var(--red);box-shadow:0 0 10px var(--red)}
.lbh{position:relative;height:12px;margin-top:3px;border-radius:6px;background:#1a0814;box-shadow:inset 0 0 0 1px #6a2a4a}
.lbh i{position:absolute;left:1px;top:1px;bottom:1px;border-radius:5px;background:linear-gradient(90deg,#ff3d6a,#ffa04a);transition:width .25s}
.lbh span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:800 9.5px var(--num);text-shadow:0 1px 2px #000}
.lbk{height:5px;margin-top:3px;border-radius:3px;background:#1a1408;box-shadow:inset 0 0 0 1px #6a5a2a;overflow:hidden}
.lbk i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffd36a,#fff);transition:width .25s}
.lbk.on i{background:linear-gradient(90deg,#fff,#ffd36a)}
#app.lbw #combo{top:calc(env(safe-area-inset-top,0px) + 104px)}
#app.lbw #dbg{top:calc(env(safe-area-inset-top,0px) + 96px)}
#dbg pre{margin:0;font:inherit;white-space:pre-wrap}
/* (v0.7) スキル: 顔の下のゲージ、たまったら金色に光る。タップで説明と「使う」 */
.face .skb{position:absolute;left:5px;right:5px;bottom:23px;height:4px;border-radius:2px;background:#000a;overflow:hidden}
.face .skb i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7fd8ff,#e8f8ff);transition:width .3s}
.face.skr{box-shadow:inset 0 0 0 2px #ffe08a,0 0 16px #ffc84a,0 3px 8px #000a}
.face.skr .skb i{background:linear-gradient(90deg,#ffc84a,#fff6d0)}
.face .skl{position:absolute;left:50%;bottom:29px;transform:translateX(-50%);font:900 9px var(--num);letter-spacing:.06em;color:#2a1600;background:#ffd36a;border-radius:4px;padding:0 5px;display:none}
.face.skr .skl{display:block}
#skp{position:absolute;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(var(--panelH,190px) + 10px);padding:12px 14px;border-radius:12px;background:linear-gradient(180deg,#152a58f2,#0a1430f2);box-shadow:inset 0 0 0 1px #5d8fd8aa,0 8px 24px #000c;pointer-events:auto}
#skp h3{margin:0 0 2px;font:900 15px var(--ui)}#skp h3 small{font:800 11px var(--ui);color:var(--dim);margin-left:6px}
#skp p{margin:0 0 10px;font:500 12.5px/1.55 var(--ui);color:#cfe0ff}
#skp .row{display:flex;gap:8px;align-items:center}#skp .st{flex:1;font:800 12px var(--ui);color:var(--gold)}
#skp .go{background:linear-gradient(180deg,#ffd36a,#d08a20);color:#2a1600;box-shadow:inset 0 0 0 1px #fff8,0 0 12px #ffb44a88}
#skp .go:disabled{background:#2a3a5a;color:#7f93b8;box-shadow:none}
#dbg .btn{pointer-events:auto;font-size:11px;padding:5px 8px}
@media (prefers-reduced-motion:reduce){#burst.ready{animation:none}}
/* ================= (v1.0) UI: 紺の板+金の縁どり。六角の札・宝石・リボン ================= */
.pill{position:relative;isolation:isolate;padding:5px 14px 6px;border-radius:0;background:var(--gold-line);box-shadow:0 3px 8px #0009;clip-path:polygon(9px 0,calc(100% - 9px) 0,100% 50%,calc(100% - 9px) 100%,9px 100%,0 50%);font:700 11px var(--cin);letter-spacing:.1em;color:#ecdcb2;align-items:baseline}
.pill::before{content:"";position:absolute;inset:1.5px;z-index:-1;background:var(--navy);clip-path:inherit}
.pill::after{content:"";position:absolute;left:12px;right:12px;top:2px;height:1px;background:linear-gradient(90deg,transparent,#ffffff55,transparent)}
.pill b{font:800 15px var(--num);color:#fff;text-shadow:0 0 8px #ffcf5a99,0 1px 0 #000}
.pill.t{color:#ecdcb2;font-weight:700}.pill.t b{color:#fff}
.btn{border-radius:6px;background:var(--navy);box-shadow:inset 0 0 0 1px #e9c46a,inset 0 0 0 2px #0b1230,inset 0 1px 0 3px #ffffff18,0 2px 6px #0009;color:#f3e6c4}
#bdbg{font:700 10px var(--ui);padding:5px 9px;opacity:.85}
#combo .n{font:900 54px/1 var(--num);color:#fff8de;background:linear-gradient(180deg,#ffffff 20%,#ffe08a 55%,#ff9a2a 90%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 2px 0 #6a2a00) drop-shadow(0 0 10px #ff9a2a99)}
#combo .w{font:900 17px var(--cin);letter-spacing:.14em;color:#ffe9b0;text-shadow:0 2px 0 #4a2200,0 0 8px #ffb44a88}
#combo .s{font:800 11px var(--ui);color:#ffe6a8;text-shadow:0 1px 2px #000}
#hint span{border-radius:4px;padding:6px 16px;background:linear-gradient(180deg,#141d44e6,#0a1028e6);box-shadow:inset 0 0 0 1px #e9c46a99,inset 0 0 0 2px #0a1028,0 3px 10px #0008;color:#f1e7cc}
.bot{isolation:isolate;background:none;padding-top:0}
/* (v1.0) 下の台: 紺の厚い板+上のふちに金の二重線と真ん中の飾り */
.bot::before{content:"";position:absolute;inset:0;z-index:-1;background:repeating-linear-gradient(135deg,#ffffff05 0 2px,transparent 2px 9px),linear-gradient(180deg,#22336e 0,#121c48 26%,#0a1030 70%,#060918 100%);border-top:2px solid #f3d27a;box-shadow:0 -3px 0 #2a1a04,0 -5px 0 #c9993c,0 -12px 24px #000b,inset 0 1px 0 #ffffff55}
.bot::after{content:"";position:absolute;left:50%;top:-11px;width:22px;height:22px;transform:translateX(-50%) rotate(45deg);background:radial-gradient(circle at 35% 35%,#fff 0 12%,#7fe8ff 40%,#1a5ab8 100%);box-shadow:0 0 0 2px #f3d27a,0 0 0 4px #2a1a04,0 0 12px #5fe4ff}
.party{gap:6px;padding-top:30px}
.face{padding:2px;border-radius:10px;background:var(--gold-line);box-shadow:0 4px 10px #000c;overflow:visible}
.face .art{inset:2px;border-radius:8px;width:calc(100% - 4px)!important;height:calc(100% - 4px)!important}
.face::before{content:"";position:absolute;inset:2px;border-radius:8px;box-shadow:inset 0 0 0 1px #0008,inset 0 10px 14px -10px #ffffff66;z-index:1;pointer-events:none}
.face .nm{left:2px;right:2px;bottom:2px;border-radius:0 0 8px 8px;padding:12px 0 3px;font:900 12px var(--ui);background:linear-gradient(180deg,transparent,#060a20e6 55%);text-shadow:0 1px 2px #000,0 0 6px #000;z-index:2}
.face .nm::before{content:"";position:absolute;left:10%;right:10%;top:10px;height:1px;background:linear-gradient(90deg,transparent,#e9c46a,transparent)}
.face .el{left:-5px;top:-5px;width:20px;height:20px;padding:0;border-radius:50%;display:grid;place-items:center;font:900 10px var(--ui);color:#fff;text-shadow:0 1px 1px #000;z-index:3;background:radial-gradient(circle at 35% 30%,#fff 0 8%,var(--ec) 40%,var(--ee) 100%);box-shadow:0 0 0 1.5px #f3d27a,0 0 0 2.5px #3a2808,0 2px 4px #000a}
.face .cr{right:-5px;top:-5px;width:18px;height:18px;padding:0;border-radius:50%;place-items:center;font:900 10px var(--cin);color:#3a2000;background:radial-gradient(circle at 35% 30%,#fff 0 10%,#ffd36a 45%,#b8761a);box-shadow:0 0 0 1.5px #fff3c4,0 2px 4px #000a;z-index:3}
.face.lead .cr{display:grid}
.face.turn{transform:translateY(-10px);box-shadow:0 0 0 2px #fff6d8,0 0 18px 2px #ffd36a,0 6px 12px #000c}
.face.turn::after{content:"手番";white-space:nowrap;top:-19px;left:50%;transform:translateX(-50%);border-radius:3px;padding:1px 9px 2px;font:900 10px var(--ui);color:#2a1600;background:var(--gold-line);box-shadow:0 2px 6px #000a;z-index:3}
.face .skb{left:7px;right:7px;bottom:25px;height:4px;z-index:2;box-shadow:0 0 0 1px #0009}
.face .skb i{background:linear-gradient(90deg,#7fd8ff,#e8f8ff)}
.face.skr{box-shadow:0 0 0 2px #fff6d8,0 0 16px #ffc84a,0 4px 10px #000c}
.face.turn.skr{box-shadow:0 0 0 2px #fff6d8,0 0 22px 4px #ffd36a,0 6px 12px #000c}
.face.skr .art{animation:skshine 1.6s ease-in-out infinite}
@keyframes skshine{50%{filter:brightness(1.25) saturate(1.1)}}
.face .skl{bottom:32px;z-index:3;font:900 8.5px var(--cin);letter-spacing:.1em;background:var(--gold-line);color:#2a1600;box-shadow:0 1px 3px #000a}
#burst{width:72px;height:72px;padding:0;opacity:1;font:900 12px var(--cin);letter-spacing:.06em;color:#dfe9ff;
  background:radial-gradient(circle closest-side,#3a6ae0 0,#16286a 60%,#0a1236 79%,transparent 80.5%),conic-gradient(#ffd36a 0 calc(var(--bp,0)*1%),#1a2450 0 100%);
  box-shadow:0 0 0 2px #e9c46a,0 0 0 4px #1a1206,0 4px 12px #000c;text-shadow:0 1px 2px #000}
#burst::before{content:"";position:absolute;inset:7.5px;border-radius:50%;box-shadow:inset 0 0 0 1px #e9c46a88,inset 0 8px 12px -6px #ffffff66;pointer-events:none}

const CFG={ /* 【仮設定】 */
  R:7.5,               // アリーナの半径(m)

  dmgK:.95,            // ダメージの係数 (v1.0 下げた)
  settleV:.2,          // これより遅くなったら落ち着いた
  turnMax:6,          // 1手番の最長時間
  calmDamp:3.2,calmT:1.2,calmIdle:1.0,calmIn:1.0,calmAge:3.5,calmAgeK:.6, // (v1.6) 解放から calmT 秒たって calmIdle 秒ダメージが出ていない(またはどれもダメージが出ない速さより遅い)とき、床の摩擦を calmIn 秒かけてゆっくり強める。解放から calmAge 秒より後は、時間とともに少しずつ摩擦が増える(長すぎる転がりを防ぐ)
  burstNeed:40,        // バーストに必要なコンボ数の合計
  /* (v0.4) */
  fogR:1.9,fogTurns:3,fogHurt:.04,fogFoe:70,jarBreak:3.0,   // 毒霧: 半径・残る手番数・味方が通るとチームHPの何割減るか・中の敵への毒・壺が割れる速さ

  weakHW:16*Math.PI/180,brkHW:80*Math.PI/180,weakK:4,      // 弱点の幅(半分)・ブレイク中の弱点の幅・弱点ダメージ倍率
  lbBrkHit:12,lbBrkClaw:35,telR:2.6,
  /* (v1.4) 考える所(D-090〜D-097)【仮設定】 */
  /* (v1.5 試作) 遊び方「詰めて潰す」: 中心に詰めた物の重さで、一緒に詰めた敵が潰れる。ぶつかりのダメージは弱くする */
  pressK:55,pressSplit:.7,   // 敵を何体も一緒に詰めると、1体あたりの潰れ方は弱くなる(重い物で1体を集中して潰すか、広く浅くか)
 pressR:2.7,pressHitK:.3,pressDamp:2.2,
  healOrb:.10,                // 回復球(前は .15。回復が多すぎて攻撃がこわくなかった)

  telE:1.8,telB:3.4,          // 攻撃予告の赤い円の半径(小さな竜・中ボス)
  lbAllyK:1,                 // ラスボスの攻撃: 円の中の味方1人あたり、一撃の何倍か

  crushOn:false,waveOn:false,   // (v1.0) 圧縮そのもののダメージ(圧壊・衝撃波)。難易度で調整するので今は切っておく。true にすると戻る
  crushR:.55,crushIv:[.085,.04],crushDmg:[2,7],waveDmg:[12,36],                                // ラスボス戦のカメラ: 見下ろす角度・距離の倍率・注視点の高さ・奥へずらす量                      // 弱点1発/爪を壊したときのブレイクゲージ・攻撃範囲の半径

  m.position.set(0,.07,0);m.renderOrder=-4;S.add(m);RFX.push({upd(t){const k=Math.min(1,t/dur);m.material.uniforms.uT.value=t;m.material.uniforms.uK.value=k;if(k>=1)return false},clean(){rmMesh(m)}})}

/* --- 潮騒の歌(シオン・潮の歌い手): ハープの音符がふわっと広がる → 水しぶきの波が3回、盤面のはしまで寄せる → 味方から水が噴き上がって回復 --- */
function noteFly(x,z,i,s){s=(s||1)*1.25;const m=tSpr(i%2?RT2.note2:RT2.note,0xffffff,.01);const a=Math.random()*6.283,sp=(.8+Math.random()*1.4)*s,ph=Math.random()*6.283,L=1.2+Math.random()*.4;
  RFX.push({upd(t){const k=Math.min(1,t/L);m.position.set(x+Math.cos(a)*sp*t+Math.sin(t*5+ph)*.25,1.1+t*2.2*s,z+Math.sin(a)*sp*t);m.scale.setScalar(.95*s*Math.min(1,eBack(Math.min(1,t/.18))));m.material.rotation=Math.sin(t*4+ph)*.35;m.material.opacity=k>.65?(1-k)/.35:1;if(k>=1)return false},clean(){rmSpr(m)}})}
function tideRing(x,z,w){const D=.95;RFX.push({upd(t){const k=Math.min(1,t/D),r=.6+(CFG.R+1-.6)*eOut(k);const n=k<1?7:0;for(let j=0;j<n;j++){const a=Math.random()*6.283,px=x+Math.cos(a)*r,pz=z+Math.sin(a)*r;if(Math.hypot(px,pz)>CFG.R-.2)continue;const q=spark(px,.15,pz,Math.cos(a)*1.5,3.5+Math.random()*2.5,Math.sin(a)*1.5,Math.random()<.45?0xffffff:w?0x5ac8ff:0x9ae8ff,.3,.42,12,.6);q.fl=1}if(k>=1)return false}})}
function skTide(si){const me=allyBody(si)||{x:0,z:3};const v=Math.round(G.hpMax*.2);hitStop(.04);tintFlash('rgba(90,200,255,.3)');
  ringFx(me.x,me.z,.3,1.8,.35,0xffffff,.1);for(let k=0;k<12;k++)later(k*.05,()=>noteFly(me.x,me.z,k));
  flameWave(me.x,me.z,CFG.R,.9,2);for(let w=0;w<3;w++)later(.08+w*.22,()=>{tideRing(me.x,me.z,w);ringFx(me.x,me.z,.3,CFG.R+.5,.9,w?0x5ac8ff:0xbaf4ff,.05)});
  later(.45,()=>{G.hp=Math.min(G.hpMax,G.hp+v);for(const a of G.bodies){if(!a.alive||a.k!=='ally')continue;flamePillar(a.x,a.z,2.6,.55,.6,0,2);a.flashA=1;noteFly(a.x,a.z,a.ai,.6)}num(me.x,1.8,me.z,'+'+v,'heal');ui()});
  G.tideT=2;hint('潮騒の歌 ─ チームHP+'+v+'、次の2手番も回復');logC('潮騒の歌 +'+v)}

/* --- 茨の呪い(イバラ・茨の魔女): 足元に魔法陣 → 地面を茨が這って敵へ → 敵のまわりから、とげの付いた茨が何本も突き出して巻きつく --- */
function thornMesh(h){const c=new THREE.QuadraticBezierCurve3(new THREE.Vector3(0,0,0),new THREE.Vector3(-.12*h,.72*h,0),new THREE.Vector3(.5*h,1.02*h,0));const TS=12,RS=6;
  const g=new THREE.TubeGeometry(c,TS,.13*Math.min(1.4,h/1.5+.4),RS,false);const P=g.attributes.position,col=new Float32Array(P.count*3),cc=new THREE.Vector3(),v=new THREE.Vector3(),C0=new THREE.Color(0x2a6a34),C1=new THREE.Color(0x5ad468),C2=new THREE.Color(0xff5aa8),tc=new THREE.Color();
  for(let i=0;i<=TS;i++){const t=i/TS;c.getPointAt(t,cc);const sc=Math.pow(1-t,.85);for(let j=0;j<=RS;j++){const id=i*(RS+1)+j;v.fromBufferAttribute(P,id).sub(cc).multiplyScalar(sc).add(cc);P.setXYZ(id,v.x,v.y,v.z);
    if(t<.55)tc.copy(C0).lerp(C1,t/.55);else tc.copy(C1).lerp(C2,(t-.55)/.45);const sh=j<RS/2?1:.72;col[id*3]=tc.r*sh;col[id*3+1]=tc.g*sh;col[id*3+2]=tc.b*sh}}
  g.setAttribute('color',new THREE.BufferAttribute(col,3));g.computeVertexNormals();const grp=new THREE.Group();grp.add(new THREE.Mesh(g,new THREE.MeshBasicMaterial({vertexColors:true})));
  grp.add(new THREE.Mesh(g,new THREE.ShaderMaterial({side:THREE.BackSide,vertexShader:'void main(){gl_Position=projectionMatrix*modelViewMatrix*vec4(position+normal*.045,1.);}',fragmentShader:'void main(){gl_FragColor=vec4(.04,.1,.06,1.);}'})));
  for(const t of [.3,.55,.75]){const p=c.getPointAt(t),tg=c.getTangentAt(t);const s=new THREE.Mesh(new THREE.ConeGeometry(.055*h/1.5+.04,.3*h/1.5+.12,4),new THREE.MeshBasicMaterial({color:t>.6?0xff5aa8:0x8af07a}));s.position.copy(p);
    s.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),new THREE.Vector3(-tg.y,tg.x,(Math.random()-.5)*.6).normalize());grp.add(s)}
  return grp}
function thornBurst(x,z,r,big){const n=big?10:7,R=r+.4;for(let i=0;i<n;i++){const a=i/n*6.283+Math.random()*.4,px=x+Math.cos(a)*R,pz=z+Math.sin(a)*R,h=(big?3.6:2.3)*(.8+Math.random()*.4);
  const g=thornMesh(h);g.position.set(px,0,pz);g.rotation.y=Math.atan2(-(z-pz),x-px);g.scale.setScalar(.01);S.add(g);const dl=i*.025,D=1.05;
  RFX.push({upd(t){const u=t-dl;if(u<0)return;const k=u/D;let s;if(u<.16)s=eBack(u/.16);else if(k<.72)s=1+Math.sin(u*18)*.02*(1-k);else s=Math.max(.01,1-(k-.72)/.28);g.scale.set(s,s*(k>.72?s:1),s);g.position.y=k>.72?-(k-.72)*1.2:0;if(k>=1)return false},clean(){rmGrp(g)}})}
  for(let k=0;k<10;k++){const q=spark(x+(Math.random()-.5)*r*2,.4,z+(Math.random()-.5)*r*2,0,1.4+Math.random(),0,Math.random()<.5?0xb04aff:0x6aff8a,.26,.8,-1,1);q.fl=1}
  vf('HIT',x,big?1.4:.8,z,{row:VFROW['木']??0,s:big?3:2,d:.3,gl:.6})}
function skThorn(si){const me=allyBody(si)||{x:0,z:3};const d=Math.round(50*ALLIES[si].atk);hitStop(.05);G.shake=Math.max(G.shake,.3);screenTint('saturate(.75) hue-rotate(35deg) brightness(.88)',800);
  ringFx(me.x,me.z,.3,2.6,.5,0x9a4aff,.06);ringFx(me.x,me.z,.3,2.1,.45,0x6ad07a,.12);thornBurst(me.x,me.z,.9,false);
  const F=foes().filter(f=>f.k!=='claw');F.forEach((f,k)=>later(.2+k*.06,()=>{if(!f.alive)return;
    for(let j=0;j<16;j++){const t=j/15;later(t*.18,()=>{const q=spark(lerp(me.x,f.x,t)+(Math.random()-.5)*.3,.18,lerp(me.z,f.z,t)+(Math.random()-.5)*.3,0,.6,0,j%3?0x3aa84a:0xd04a8a,.3,.45,0,0);q.fl=1})}
    later(.2,()=>{if(!f.alive)return;f.psn=3;f.psnD=d;thornBurst(f.x,f.z,f.r,f.k==='boss');G.shake=Math.max(G.shake,.25);num(f.x,1.9,f.z,'毒 3手番','txt')})}));
  if(LB.on&&LB.hp>0){LB.psn=3;LB.psnD=d;later(.45,()=>{thornBurst(0,LBZ+3,2.2,true);num(0,9,LBZ+4,'毒 3手番','txt')})}
  hint('茨の呪い ─ 敵全員が3手番のあいだ毎手番'+d+'ダメージ');logC('茨の呪い')}

/* --- 聖剣一閃(リュミエ・光の剣士): 光が集まって頭の上に光の剣 → 敵がいちばん多い列を、三日月の剣筋が左から右へ一気に斬る → 斬られた敵に十字の光 --- */
function crossFlash(x,z,s){for(const [r,c,w] of [[.62,0xffd25a,.6],[-.62,0xffd25a,.6],[.62,0xffffff,.26],[-.62,0xffffff,.26]]){const m=tSpr(RT.glow,c,1,true);m.material.rotation=r;m.position.set(x,1,z);RFX.push({upd(t){const k=Math.min(1,t/.36);m.scale.set(4.6*s*(.5+.5*eOut(k)),w*s*(1-k*k),1);if(k>=1)return false},clean(){rmSpr(m)}})}}
function slashArc(z0,L){const W=L*2,D=4.6,g=new THREE.PlaneGeometry(W,D);
  const m=new THREE.Mesh(g,new THREE.ShaderMaterial({uniforms:{uK:{value:0}},transparent:true,depthWrite:false,depthTest:false,blending:THREE.AdditiveBlending,toneMapped:false,
    vertexShader:'varying vec2 vU;void main(){vU=uv*2.-1.;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
    fragmentShader:'uniform float uK;varying vec2 vU;void main(){float x=vU.x,y=vU.y;float yc=.5*(1.-x*x)-.4;float th=.5*pow(max(0.,1.-x*x),.7);float d=y-yc;if(d<0.||d>th)discard;float e=d/th;float head=-1.2+uK*3.2;float tail=head-1.5;float m=smoothstep(head+.02,head-.12,x)*smoothstep(tail,tail+.9,x);float fade=1.-smoothstep(.55,1.,uK);float thin=smoothstep(1.-.75*(1.-uK*.6),1.,e);vec3 c=mix(vec3(1.,.72,.2),vec3(1.,.95,.75),smoothstep(.4,.9,e))+vec3(1.)*smoothstep(.86,.98,e);float a=m*fade*(.55+.45*thin)*(.5+.5*e);if(a<.01)discard;gl_FragColor=vec4(c*a*1.9,1.);}'}));
  m.position.set(0,1.2,z0);m.renderOrder=16;S.add(m);RFX.push({upd(t){const k=Math.min(1,t/.42);m.quaternion.copy(cam.quaternion);m.material.uniforms.uK.value=k;if(k>=1)return false},clean(){rmMesh(m)}})}
function skHoly(si){const me=allyBody(si)||{x:0,z:3};const dm=Math.round(230*ALLIES[si].atk);const F=foes().filter(f=>f.k!=='claw');
  let z0=-2,best=-1;for(const f of F){const n=F.filter(g=>Math.abs(g.z-f.z)<1.1).length;if(n>best){best=n;z0=f.z}}
  /* ため: 光が集まり、頭の上に光の剣が立つ */
  for(let k=0;k<26;k++){const a=Math.random()*6.283,r=2.2+Math.random()*1.4;const q=spark(me.x+Math.cos(a)*r,.6+Math.random()*1.6,me.z+Math.sin(a)*r,-Math.cos(a)*r*3.2,0,-Math.sin(a)*r*3.2,Math.random()<.5?0xffffff:0xffe08a,.3,.3,0,0);q.fl=1}
  const bl=tSpr(RT.glow,0xfff2b8,1,true),bc=tSpr(RT.glow,0xffffff,1,true);
  RFX.push({upd(t){const k=Math.min(1,t/.4),g=eOut(Math.min(1,t/.22));bl.scale.set(.9,4.6*g,1);bc.scale.set(.32,4*g,1);bl.position.set(me.x,1.4+2.3*g,me.z);bc.position.copy(bl.position);bl.material.opacity=bc.material.opacity=k>.8?(1-k)/.2:1;if(k>=1)return false},clean(){rmSpr(bl);rmSpr(bc)}});

  later(.36,()=>{tintFlash('rgba(255,250,220,.6)');hitStop(.1);G.shake=Math.max(G.shake,.6);const L=CFG.R+1.5;slashArc(z0,L);
    for(let k=0;k<30;k++){const x=-L+k/29*2*L;later(.04+k*.006,()=>{const q=spark(x,1,z0+(Math.random()-.5)*.8,5+Math.random()*4,(Math.random()-.2)*3,(Math.random()-.5)*3,Math.random()<.5?0xffffff:0xffd25a,.3,.45,4,2);q.fl=1})}
    for(const f of foes()){if(Math.abs(f.z-z0)>=1.1+f.r)continue;const dl=.05+((f.x+L)/(2*L))*.2;later(dl,()=>{if(!f.alive)return;crossFlash(f.x,f.z,f.k==='boss'?1.6:1);vf('MB',f.x,1,f.z,{s:2.6,d:.4,tint:0xffd25a,roll:0,gl:1});stars(f.x,1,f.z,10,0xffd25a,4);hurt(f,dm,f.x,f.z)})}
    if(LB.on&&LB.hp>0)later(.2,()=>lbDamage(Math.round(dm*.6),0,6,LBZ))});

/* --- 仕掛け爆弾(ポム・爆弾職人): 導火線に火の付いた爆弾を、弧を描いて2つ放り投げる → 地面ではねて置かれる --- */
const BOMBG=new THREE.SphereGeometry(.34,18,12);BOMBG.userData.keep=1;
function bombToss(from,to,dl){const g=new THREE.Group();const b=new THREE.Mesh(BOMBG,new THREE.MeshStandardMaterial({color:0x2a2c3a,roughness:.35,metalness:.4,emissive:0x101018}));g.add(b);
  const fu=new THREE.Mesh(new THREE.CylinderGeometry(.045,.05,.24,6),new THREE.MeshStandardMaterial({color:0xb08a50,roughness:.9}));fu.position.set(.08,.38,0);fu.rotation.z=-.4;g.add(fu);
  const cap=new THREE.Mesh(new THREE.CylinderGeometry(.12,.12,.08,10),new THREE.MeshStandardMaterial({color:0x6a6a78,metalness:.6,roughness:.4}));cap.position.y=.32;g.add(cap);
  g.scale.setScalar(1.7);const hl=new THREE.Mesh(BOMBG,new THREE.ShaderMaterial({side:THREE.BackSide,vertexShader:'void main(){gl_Position=projectionMatrix*modelViewMatrix*vec4(position*1.14,1.);}',fragmentShader:'void main(){gl_FragColor=vec4(1.,.85,.55,1.);}'}));g.add(hl);g.visible=false;S.add(g);const fl=glowSpr(0xffc040,.01);const D=.5,H=3.4;let done=false;
  RFX.push({upd(t){const u=t-dl;if(u<0)return;g.visible=true;const k=Math.min(1,u/D);const px=lerp(from.x,to.x,k),pz=lerp(from.z,to.z,k);let py=.5+Math.sin(k*Math.PI)*H*(1-k*.15);
      g.position.set(px,py,pz);g.rotation.z=-k*7;g.rotation.x=k*2;const tip=new THREE.Vector3(.13,.5,0).multiplyScalar(1.7).applyEuler(g.rotation).add(g.position);fl.position.copy(tip);fl.scale.setScalar(.9+Math.random()*.5);
      if(Math.random()<.8){const q=spark(tip.x,tip.y,tip.z,(Math.random()-.5)*2,1+Math.random()*2,(Math.random()-.5)*2,Math.random()<.5?0xffffff:0xffb030,.18,.3,6,1);q.fl=1}

    clean(){rmGrp(g);rmSpr(fl)}})}
function skBombs(si){const me=allyBody(si)||{x:0,z:3};const F=foes().filter(f=>f.k!=='claw');let c={x:0,z:-2},best=-1;for(const f of F){const n=F.filter(g=>Math.hypot(g.x-f.x,g.z-f.z)<2.5).length;if(n>best){best=n;c=f}}

/* --- 泡の守り(プクル・泡の人魚): 味方をにじ色の大きな泡が包む。泡は敵の手番が終わるまで残って、終わるとはじける --- */
const BUBG=new THREE.SphereGeometry(1,36,24);BUBG.userData.keep=1;
function bubbleOn(a,dl){const m=new THREE.Mesh(BUBG,new THREE.ShaderMaterial({uniforms:{uT:{value:0},uA:{value:0}},transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,toneMapped:false,

    fragmentShader:'uniform float uT,uA;varying vec3 vN,vV,vP;void main(){float f=1.-abs(dot(vN,vV));float rim=pow(f,2.);vec3 ir=.5+.5*cos(6.2832*(f*1.3+vP.y*.5+uT*.2+vec3(0.,.33,.67)));vec3 c=mix(vec3(.5,.88,1.),ir,.5)*rim*1.25+vec3(.25,.6,1.)*.07;float hl=smoothstep(.95,.995,dot(vN,normalize(vec3(-.45,.55,.7))));c+=vec3(1.)*hl;gl_FragColor=vec4(c*uA,1.);}'}));

/* --- 追い風(フウタ・風の郵便屋): 白い風の筋が盤面を吹き抜け、木の葉と手紙が舞う。追い風が残っている間は味方のまわりを風が回る --- */
function windRibbon(zc,ph,dl,dir){const N=48,L=CFG.R+3,g=new THREE.BufferGeometry(),pos=new Float32Array((N+1)*2*3),uv=new Float32Array((N+1)*2*2),idx=[];

  m.renderOrder=15;m.visible=false;S.add(m);RFX.push({upd(t){const u=t-dl;if(u<0)return;m.visible=true;const k=Math.min(1,u/.75);m.material.uniforms.uK.value=k;if(k>=1)return false},clean(){rmMesh(m)}})}

/* ===== (11/9) マルチ(協力)の土台。4人まで・1人1体・番の人だけが引く(山本さん)
   同じ手(押した中心 C と強さ p)を全員の端末で同じように動かす(ロックステップ):
   - 1手ごとに決まった種で Math.random を作りなおす(会心・敵のねらいなどが全員同じになる)
   - 時間は 1/60 秒きざみで進める(画面が120Hzでも同じ)
