<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>きもオタTCG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Shippori+Mincho+B1:wght@600;800&family=Cinzel:wght@600;700&display=swap">
<style>
:root{
  --bg:#07070c;--felt1:#16142a;--felt2:#0a0a14;--panel:#191925;--line:#2c2c3c;--fg:#f3f2f7;--mut:#8f8d9c;
  --gold:#e2bd62;--atk:#ff7a45;--def:#4aa3ff;--ok:#46d18c;--bad:#ff5d6c;--trap:#a98bff;--spell:#5ee39a;
  --weak:#7f95bd;--girl:#ff7fae;--gay:#b48cff;--gen:#d2ab5c;
  --disp:'Dela Gothic One','Hiragino Sans','Noto Sans JP',system-ui,sans-serif;
  --body:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif;
  color-scheme:dark}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 var(--body);-webkit-font-smoothing:antialiased;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
svg{display:block}
.scr{position:fixed;inset:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px) 0;display:flex;flex-direction:column}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:46px;padding:0 20px;border-radius:999px;background:linear-gradient(180deg,#f3d58a,var(--gold) 55%,#b98c2c);color:#241a04;font-weight:800;box-shadow:0 6px 18px #e2bd6233;white-space:nowrap}
.btn.sec{background:var(--panel);color:var(--fg);box-shadow:none;border:1px solid var(--line)}
.btn.vio{background:linear-gradient(180deg,#d9ccff,var(--trap) 55%,#6a4fc9);color:#160d33;box-shadow:0 6px 18px #a98bff44}
.btn:disabled{opacity:.38}
.k{font:600 11px/1 var(--body);letter-spacing:.32em;color:var(--gold)}
/* ---------- title / deck / toss ---------- */
#s-title{align-items:center;justify-content:center;gap:18px;padding:24px 16px;background:radial-gradient(110% 60% at 50% 0%,#2a2010,transparent 60%),var(--bg)}
#s-title h1{margin:0;font:400 46px/1.05 var(--disp);text-align:center;background:linear-gradient(180deg,#fff6d8,var(--gold) 60%,#9d7426);-webkit-background-clip:text;background-clip:text;color:transparent}
#s-title .sub{color:var(--mut);text-align:center;max-width:32ch;margin:0;text-wrap:balance;font-size:13px}
.fan{display:flex;justify-content:center;height:156px;margin:6px 0}
.fan .bc{width:100px;margin:0 -22px;box-shadow:0 14px 30px #000b}
#s-deck{padding:18px 16px;gap:12px;overflow-y:auto}
#s-deck h2{margin:0;font:400 24px/1.2 var(--disp)}
#s-deck .hint{margin:0;color:var(--mut);font-size:13px}
.dk{border-radius:20px;padding:14px;background:linear-gradient(135deg,color-mix(in srgb,var(--dc) 20%,var(--panel)),var(--panel) 70%);border:1px solid color-mix(in srgb,var(--dc) 45%,var(--line));display:flex;flex-direction:column;gap:10px;flex:none}
.dk .hd{display:flex;gap:12px;align-items:center}
.dk .hd .bc{width:66px;flex:none}
.dk h3{margin:0;font:400 21px/1.2 var(--disp)}
.dk p{margin:2px 0 0;color:#d6d4e0;font-size:12.5px}
.dk .sk{font-size:12px;color:#fff3c4;background:#0d0d1480;border:1px solid #e2bd6240;border-radius:12px;padding:8px 10px}
.dk .sk b{color:var(--gold);margin-right:6px}
.dk .strip{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.dk .strip::-webkit-scrollbar{display:none}
.dk .strip .bc{width:60px;flex:none}
#s-toss{align-items:center;justify-content:center;gap:26px;background:radial-gradient(70% 50% at 50% 45%,#2b2210,transparent 70%),var(--bg)}
.coin3d{width:150px;height:150px;position:relative;transform-style:preserve-3d}
.coin3d i,.coinm i{position:absolute;inset:0;border-radius:50%;display:grid;place-items:center;font-style:normal;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:radial-gradient(circle at 35% 30%,#fff6d0,#e8c060 45%,#9a6e1c);color:#5a3d06}
.coin3d i{font:400 54px/1 var(--disp);box-shadow:inset 0 0 0 6px #f6dd95,inset 0 0 0 10px #a77a22,0 20px 40px #0009}
.coin3d i.b,.coinm i.b{transform:rotateY(180deg);background:radial-gradient(circle at 35% 30%,#fff,#c9ced8 45%,#6b7280);color:#2c3038}
#tossRes{font:400 22px/1.35 var(--disp);text-align:center;min-height:3.2em}
#tossRes small{display:block;font:500 13px/1.6 var(--body);color:var(--mut)}
/* ---------- card face (hand / sheets / reveal) ---------- */
.bc{--dc:var(--gen);box-sizing:border-box;position:relative;aspect-ratio:59/86;border-radius:9%/6%;padding:0;display:flex;flex-direction:column;gap:2.5cqw;overflow:hidden;
  background:linear-gradient(160deg,color-mix(in srgb,var(--dc) 55%,#fff) 0%,var(--dc) 18%,color-mix(in srgb,var(--dc) 40%,#000) 100%);box-shadow:0 8px 18px #0008;container-type:inline-size}
.bc>.bh{margin:5cqw 5cqw 0}.bc>.bart,.bc>.bt,.bc>.st2,.bc>.btx{margin-inline:5cqw}.bc>.btx{margin-bottom:5cqw}
.weak{--dc:var(--weak)}.girl{--dc:var(--girl)}.gay{--dc:var(--gay)}.gen{--dc:var(--gen)}
.bc.gay{background:linear-gradient(160deg,#ffd166 0%,#ff7fae 22%,#b48cff 50%,#6aa8ff 78%,#5ee39a 100%)}
.bc.spell{box-shadow:0 0 0 2px var(--spell) inset,0 8px 18px #0008}
.bc.trap{box-shadow:0 0 0 2px var(--trap) inset,0 8px 18px #0008}
.bc .bh{display:flex;align-items:center;gap:4%;background:#0d0d14;border-radius:6cqw;padding:2.5cqw 3cqw;min-height:15cqw}
.gem{flex:none;width:15cqw;height:15cqw;border-radius:50%;display:grid;place-items:center;font:400 9cqw/1 var(--disp);color:#2a1d02;background:radial-gradient(circle at 35% 30%,#fff3c4,var(--gold) 60%,#8a6a22)}
.bc .bn{font-weight:800;font-size:9.5cqw;line-height:1.15;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;min-width:0}
.bc .bart{position:relative;border-radius:4cqw;overflow:hidden;aspect-ratio:120/100;box-shadow:inset 0 0 0 1.2cqw #0006;flex:none;background:#0d0d14}
.bc .bart svg,.bc .bart img,.u .art svg,.u .art img{width:100%;height:100%;object-fit:cover;display:block}
.bc .bt{display:flex;align-items:center;justify-content:space-between;gap:2cqw;font-size:7cqw;font-weight:800;color:#0d0d14d0;letter-spacing:.04em;padding:0 1cqw}
.bc .btx{flex:1;background:#f4f1ea;color:#1d1a22;border-radius:4cqw;padding:3cqw 4cqw;font-size:6.2cqw;line-height:1.42;overflow:hidden;white-space:pre-line}
.st2{display:flex;gap:2cqw}
.st2 b{display:flex;align-items:baseline;gap:1.2cqw;padding:1.4cqw 3cqw;border-radius:3.5cqw;font:400 9cqw/1 var(--disp);color:#fff;font-variant-numeric:tabular-nums;box-shadow:0 2px 6px #0008}
.st2 b small{font:800 5.2cqw/1 var(--body);opacity:.85;letter-spacing:.04em}
.st2 .a{background:linear-gradient(180deg,#ff9a5c,#c9461a)}
.st2 .d{background:linear-gradient(180deg,#69b6ff,#1f5fb8)}
.bc.mini .btx{display:none}
.bc.mini .bt{display:none}
.bc.mini .bart{aspect-ratio:120/104}
.bc.mini .st2{position:absolute;left:0;right:0;bottom:5cqw;justify-content:space-between}
.bc.mini .st2{margin:0 4cqw;gap:2cqw}.bc.mini .st2 b{flex:1;justify-content:center;font-size:10.5cqw;padding:2cqw 1cqw;letter-spacing:-.03em}
.bc.mini .st2 b small{display:none}
.bc.mini .tyb{position:absolute;left:5%;right:5%;bottom:5%;text-align:center;font:400 9cqw/1 var(--disp);letter-spacing:.1em;padding:3cqw 0;border-radius:4cqw;background:#0d0d14d9}
.bc.mini .tyb.s{color:var(--spell)}.bc.mini .tyb.t{color:var(--trap)}
.bc:not(.mini) .bart{aspect-ratio:120/80}
.holo::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;background:linear-gradient(115deg,transparent 30%,#ffffff55 45%,#ffe9a855 50%,#a6f0ff44 55%,transparent 70%);background-size:250% 250%;mix-blend-mode:overlay;animation:holo 3.2s ease-in-out infinite}
@keyframes holo{0%{background-position:120% 0}60%,100%{background-position:-60% 0}}
.rar{font:400 7cqw/1 var(--disp);letter-spacing:.06em}
.cb{position:relative;aspect-ratio:59/86;border-radius:9%/6%;background:radial-gradient(circle at 50% 50%,#2a2350,#0d0b1e 70%);border:1.5px solid #b89a54;box-shadow:inset 0 0 0 2px #0d0b1e,inset 0 0 0 3px #6a5a96,0 4px 10px #0008;overflow:hidden}
.cb::before{content:"";position:absolute;inset:16%;border-radius:50%;border:1px solid #b89a5499;background:repeating-conic-gradient(from 0deg,#b89a5422 0 10deg,transparent 10deg 20deg)}
/* ---------- game table: a night stage. Each lane has its own spotlight; penlight pink and cyan are the only accents ---------- */
#s-game{--pink:#ff5fb0;--cyan:#49e6ff;background:
  radial-gradient(60% 34% at 50% 0%,#2a1f55 0%,transparent 70%),
  radial-gradient(60% 34% at 50% 100%,#1d2550 0%,transparent 70%),
  linear-gradient(180deg,#0d0a20,#100d26 50%,#0b0a1c)}
.hud{position:relative;z-index:3;display:flex;align-items:center;gap:8px;padding:6px 10px;flex:none}
.hud.opp{padding-top:8px}
.hud.me{padding-bottom:4px}
.sp{flex:1}
.av{position:relative;width:42px;height:42px;flex:none;border-radius:50%;padding:0}
.av .ph{position:absolute;inset:5px;border-radius:50%;overflow:hidden;box-shadow:0 0 0 1.5px #0d0a20}
.av .ph svg,.av .ph img{width:100%;height:100%;object-fit:cover}
.av>svg{position:absolute;inset:0;width:100%;height:100%}
.av.full{animation:avg 1.4s ease-in-out infinite}
@keyframes avg{50%{filter:drop-shadow(0 0 7px #ff5fb0)}}
.skchip{flex:none;height:28px;padding:0 11px;border-radius:999px;font:400 12px/1 var(--disp);color:#fff;background:linear-gradient(180deg,#ff8cc6,#e0398f);box-shadow:0 0 14px #ff5fb088;animation:avg 1.4s ease-in-out infinite}
.goods{display:flex;align-items:center;gap:3px;flex:none;padding:3px 4px;border-radius:10px}
.goods i{width:11px;height:15px;clip-path:polygon(50% 0,100% 22%,100% 78%,50% 100%,0 78%,0 22%);background:linear-gradient(150deg,#fff6d6 0%,#ffd36b 35%,#e08a2a 70%,#ffe9a8 100%);filter:drop-shadow(0 0 3px #ffd36b88)}
.goods i.x{background:#2b2747;filter:none}
.goods b{margin-left:4px;font:400 17px/1 var(--disp);font-variant-numeric:tabular-nums;color:#fff3cf}
.goods.tgt{box-shadow:0 0 0 2px var(--pink);animation:gpulse 1s infinite}
@keyframes gpulse{50%{box-shadow:0 0 0 4px #ff5fb055,0 0 18px #ff5fb066}}
.tz2{display:flex;gap:4px;flex:none}
.tz2 .z{width:19px;height:27px;border-radius:4px;border:1px dashed #b48cff55;position:relative;padding:0}
.tz2 .z .cb{position:absolute;inset:-1px;border-radius:4px;border-width:1px}
.tz2 .z.me .cb{box-shadow:0 0 0 1.5px #b48cffcc,0 0 8px #b48cff66}
.tz2 .z.wait .cb{filter:brightness(.55)}
.meta{display:flex;align-items:center;gap:5px;font-size:12px;color:#c9c5e6}
.meta b{font:400 14px/1 var(--disp);font-variant-numeric:tabular-nums;color:#fff;margin-right:6px}
.meta b small{font:inherit;font-size:10px;color:#8f8ab3}
.ic{display:inline-block;flex:none}
.ic.hcard{width:10px;height:14px;border-radius:2px;background:linear-gradient(160deg,#3a2f74,#17123a);box-shadow:inset 0 0 0 1px #b89a54}
.ic.gem{width:10px;height:10px;transform:rotate(45deg);border-radius:2px;background:linear-gradient(135deg,#fff3c4,#e2bd62)}
.tchip{display:flex;flex-direction:column;align-items:flex-end;gap:2px;padding:4px 8px;border-radius:9px;background:#ffffff0a;border:1px solid #ffffff14;flex:none}
.tchip b{font:400 13px/1 var(--disp);color:#fff;font-variant-numeric:tabular-nums}
.tchip .heat{font:700 9.5px/1 var(--body);color:#ffb08a}
.energy{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none}
.energy .gems{display:flex;gap:3px}
.energy .gems i{width:8px;height:8px;transform:rotate(45deg);border-radius:2px;background:#2b2747}
.energy .gems i.on{background:linear-gradient(135deg,#fff3c4,#e2bd62);box-shadow:0 0 6px #e2bd6299}
.energy b{font:400 14px/1 var(--disp);font-variant-numeric:tabular-nums;color:#fff3cf}
.endb{position:relative;width:58px;height:58px;flex:none;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 50% 35%,#ffe9a8,#e2bd62 55%,#a8761f);color:#2a1d02;box-shadow:0 6px 18px #e2bd6244}
.endb svg{position:absolute;inset:-4px;width:66px;height:66px;transform:rotate(-90deg);pointer-events:none}
.endb .tr{stroke:#fff3cf}
.endb span{font:400 11px/1.15 var(--disp);white-space:pre;text-align:center;margin-top:-6px}
.endb small{position:absolute;bottom:8px;font:700 10px/1 var(--body);font-variant-numeric:tabular-nums;opacity:.7}
.endb.off{background:#1b1838;color:#8f8ab3;box-shadow:none}
.endb:disabled:not(.off){filter:saturate(.4) brightness(.7)}
.endb.warn{background:radial-gradient(circle at 50% 35%,#ffd0dc,#ff5f86 55%,#a1183a);color:#2a0310}
.endb.warn .tr{stroke:#ff5f86}
.field{position:relative;flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:1fr auto 1fr;gap:5px 6px;padding:2px 8px}
.lane{position:relative;display:grid;place-items:center;min-height:0;border-radius:14px}
.lane::before{content:"";position:absolute;inset:0;border-radius:14px;pointer-events:none;background:radial-gradient(60% 55% at 50% 50%,#ffffff0d,transparent 70%)}
.lane.o::before{background:radial-gradient(60% 55% at 50% 45%,#ff5fb00d,transparent 70%)}
.lane.pick{animation:pk 1.1s ease-in-out infinite}
.lane.pick::before{background:radial-gradient(60% 60% at 50% 50%,#ffe9a840,transparent 72%);box-shadow:inset 0 0 0 1.5px #ffe9a8aa}
@keyframes pk{50%{filter:brightness(1.35)}}
.slot{width:var(--cw);aspect-ratio:59/86;border-radius:10px;border:1px solid #ffffff10;background:repeating-linear-gradient(135deg,#ffffff05 0 6px,transparent 6px 12px)}
.ven{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:4px 2px;text-align:center;border-radius:8px;background:none;border-block:1px solid #ffffff12;position:relative}
.ven b{font:400 11px/1.15 var(--disp);color:#efeaff;letter-spacing:.02em}
.ven span{font-size:9.5px;line-height:1.2;color:#ffd36b}
.u{--dc:var(--gen);position:relative;width:var(--cw);aspect-ratio:59/86;border-radius:10px;overflow:visible;background:#0d0a20;box-shadow:0 0 0 1.5px color-mix(in srgb,var(--dc) 80%,#fff),0 10px 18px #000b;container-type:inline-size;transition:transform .2s,box-shadow .2s}
.u>.art{position:absolute;inset:0 0 24% 0;border-radius:10px 10px 0 0;overflow:hidden}
.u::after{content:"";position:absolute;inset:0;border-radius:10px;background:linear-gradient(180deg,transparent 40%,#0d0a20 76%);pointer-events:none}
.u.r-SR{box-shadow:0 0 0 1.5px #ffe08a,0 0 16px #ffe08a55,0 10px 18px #000b}
.u.r-SR>.art::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,#ffffff40 48%,#a6f0ff30 54%,transparent 66%);background-size:260% 100%;animation:holo 3.6s ease-in-out infinite;mix-blend-mode:overlay}
.u .nmb{position:absolute;left:0;right:0;bottom:27cqw;z-index:2;text-align:center;font-weight:800;font-size:10.5cqw;line-height:1.1;padding:0 4cqw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 3px #000}
.u .ust{position:absolute;left:3cqw;right:3cqw;bottom:3cqw;z-index:2;display:flex;gap:2.5cqw}
.u .ust b{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1.8cqw 0 2.2cqw;border-radius:5cqw;font:400 15cqw/1 var(--disp);color:#fff;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.u .ust b small{font:800 6.5cqw/1 var(--body);letter-spacing:.12em;opacity:.85;margin-bottom:1cqw}
.u .ust .a{background:linear-gradient(180deg,#ff9a5c,#c9461a)}
.u .ust .d{background:linear-gradient(180deg,#69b6ff,#1f5fb8)}
.u .ust b.up{box-shadow:0 0 0 1.5px #fff3c4,0 0 8px #ffe08a}
.u .ust b.dn{filter:saturate(.5) brightness(.75);box-shadow:0 0 0 1.5px #ff5d6c}
.u .kw{position:absolute;top:3cqw;left:3cqw;right:3cqw;z-index:2;display:flex;gap:2cqw;flex-wrap:wrap}
.u .kw i{font-style:normal;font-size:9cqw;font-weight:800;padding:1.4cqw 3.5cqw;border-radius:4cqw;background:#0d0a20d9;color:#fff}
.u .kw i.c{background:#e9edf6;color:#1a1f2e}
.u .kw i.y{background:var(--gold);color:#2a1d02}
.u.sick>.art{filter:saturate(.45) brightness(.6)}
.u.sick .kw::after{content:"待機";font-size:9cqw;font-weight:800;padding:1.4cqw 3.5cqw;border-radius:4cqw;background:#0d0a20d9;color:#a9a5c6;margin-left:auto}
.u.ready{box-shadow:0 0 0 2px var(--cyan),0 0 18px #49e6ff88,0 10px 18px #000b;animation:ready 1.6s ease-in-out infinite}
@keyframes ready{50%{box-shadow:0 0 0 2px var(--cyan),0 0 6px #49e6ff33,0 10px 18px #000b}}
.u.sel{transform:translateY(-6px) scale(1.05);box-shadow:0 0 0 2.5px #fff,0 0 26px #49e6ffcc;animation:none;z-index:5}
.u.tgt,.u.aim{box-shadow:0 0 0 2.5px var(--pink),0 0 22px #ff5fb0aa;animation:gpulse 1s infinite}
.u.charge{box-shadow:0 0 0 2.5px #fff,0 0 30px var(--pink),0 0 60px #ff5fb066}
.hand{position:relative;flex:none;height:calc(var(--hw)*86/59 + 18px);margin:0 0 4px}
.hand .bc{position:absolute;bottom:6px;width:var(--hw);transform-origin:50% 120%;transform:translateY(var(--y,0)) rotate(var(--r,0));transition:transform .2s,opacity .2s,filter .2s;box-shadow:0 8px 16px #000c}
.hand .bc.no{filter:saturate(.5) brightness(.7)}
.hand .bc.can{box-shadow:0 0 0 1.5px #ffe9a8,0 0 14px #ffd36b66,0 8px 16px #000c}
.hand .bc.on{transform:translateY(-14px) rotate(0) scale(1.06);z-index:20!important}
.deckmark{position:absolute;right:-30px;bottom:30px;width:20px;height:28px}
#feed{position:absolute;left:8px;top:58px;z-index:30;display:flex;flex-direction:column;gap:6px;width:min(74%,300px);pointer-events:none}
.notice{pointer-events:auto;display:flex;gap:8px;align-items:center;text-align:left;padding:6px 10px 6px 6px;border-radius:12px;background:linear-gradient(90deg,#17123aee,#17123acc);border:1px solid #ffffff1a;border-left:3px solid var(--pink);box-shadow:0 10px 24px #000a;color:#fff}
.notice.me{border-left-color:var(--cyan)}
.notice.trap{border-left-color:#b48cff}.notice.spell{border-left-color:#5ee3b0}.notice.gt{border-left-color:#ffd36b}
.notice .na{width:34px;height:34px;flex:none;border-radius:8px;overflow:hidden}
.notice .na svg,.notice .na img{width:100%;height:100%;object-fit:cover}
.notice .nt{min-width:0;display:flex;flex-direction:column;gap:1px}
.notice small{font-size:10px;color:#b9b4dc}
.notice b{font-size:13px;line-height:1.2}
.notice span{font-size:11px;line-height:1.35;color:#ddd9f3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#hint{position:absolute;left:8px;right:8px;z-index:25;transform:translateY(-50%);display:flex;align-items:center;gap:6px;padding:6px 6px 6px 12px;border-radius:14px;background:#17123af2;border:1px solid #ffffff22;box-shadow:0 12px 30px #000c}
#hint .ht{flex:1;font-size:12.5px;line-height:1.35;color:#fff}
.hb{height:34px;padding:0 14px;border-radius:999px;font-weight:800;font-size:13px;background:linear-gradient(180deg,#ff8cc6,#e0398f);color:#fff;white-space:nowrap;flex:none}
.hb.sec{background:#ffffff14;color:#e9e6ff}
.capt{position:fixed;left:50%;top:22%;z-index:49;transform:translateX(-50%);pointer-events:none;max-width:88vw;padding:9px 16px;border-radius:12px;background:#17123af0;border:1px solid #ffffff1f;font-size:13px;font-weight:700;color:#fff;text-align:center;box-shadow:0 12px 30px #000a}
/* fx layer */
.fx{position:fixed;pointer-events:none;z-index:46}
.spark{width:6px;height:6px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c),0 0 2px #fff}
.ringfx{border-radius:50%;border:2px solid var(--c);box-shadow:0 0 12px var(--c)}
.shard{width:10px;height:14px;background:var(--c,#fff);clip-path:polygon(50% 0,100% 40%,70% 100%,10% 80%)}
.shard.gold{--c:#ffd36b;width:8px;height:11px;box-shadow:0 0 6px #ffd36b}
.beam{transform:translateX(-50%);transform-origin:50% 0;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 60%,transparent),color-mix(in srgb,var(--c) 22%,transparent) 70%,transparent);clip-path:polygon(40% 0,60% 0,100% 100%,0 100%);mix-blend-mode:screen;z-index:2}
.floor{height:18px;border-radius:50%;background:radial-gradient(closest-side,color-mix(in srgb,var(--c) 85%,#fff),transparent);mix-blend-mode:screen}
.trail{height:6px;margin-top:-3px;transform-origin:0 50%;border-radius:6px;background:linear-gradient(90deg,transparent,#ff5fb0 40%,#fff);box-shadow:0 0 14px #ff5fb0,0 0 30px #ff5fb088;z-index:45}
.hitflash{width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,#fff 0%,#ffd6ea 25%,#ff5fb066 50%,transparent 70%);mix-blend-mode:screen}
.slash{height:5px;border-radius:5px;background:linear-gradient(90deg,transparent,#fff 30%,#fff 70%,transparent);box-shadow:0 0 12px #fff,0 0 24px #ff5fb0}
.halo{width:340px;height:340px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--c) 45%,transparent) 0%,transparent 65%);z-index:44}
.bc.show{z-index:47;box-shadow:0 0 0 2px #fff6,0 0 50px var(--gc),0 24px 50px #000c}
.slab{left:50%;z-index:48;padding:6px 16px;font:400 15px/1 var(--disp);letter-spacing:.08em;color:#0d0a20;transform:translateX(-50%) skewX(-12deg)}
.slab.spell{background:#5ee3b0}.slab.trap{background:#b48cff}.slab.gt{background:#ffd36b}
.clash{position:fixed;z-index:47;transform:translate(-50%,-50%);pointer-events:none;display:flex;flex-direction:column;gap:3px;padding:6px 10px;border-radius:12px;background:#0d0a20f2;border:1px solid #ffffff2a;box-shadow:0 14px 30px #000c}
.clash .cr{display:flex;align-items:center;gap:6px;justify-content:center}
.clash .cr span{display:flex;align-items:baseline;gap:3px;font:400 17px/1 var(--disp);font-variant-numeric:tabular-nums}
.clash .cr small{font:800 8.5px/1 var(--body);color:#a9a5c6;letter-spacing:.06em}
.clash .ca{color:#ffb08a}.clash .cd{color:#9fd0ff}
.clash .cr i{font:400 15px/1 var(--disp);font-style:normal;color:#fff;opacity:.8}
.clash .cr.ok i{color:var(--pink);opacity:1}
.clash .cr:nth-child(2) span{font-size:13px}
.clash .cr.mut{opacity:.4}
.stamp{position:absolute;left:50%;top:40%;z-index:9;transform:translate(-50%,-50%) rotate(-12deg);padding:4px 10px;font:400 18px/1 var(--disp);letter-spacing:.06em;color:#fff;background:#e0398f;border:2px solid #fff;border-radius:6px;box-shadow:0 0 18px #ff5fb0;white-space:nowrap;pointer-events:none;animation:stampin .3s cubic-bezier(.2,1.6,.4,1) both,fade .3s 1s reverse forwards}
.stamp.blue{background:#1f5fb8;box-shadow:0 0 18px #49e6ff}
.stamp.pink{background:#9b1d5e}
.stamp.gold{background:#c48a1c;box-shadow:0 0 18px #ffd36b}
@keyframes stampin{from{transform:translate(-50%,-50%) rotate(-12deg) scale(2.2);opacity:0}}
.float{position:absolute;left:50%;top:30%;z-index:8;transform:translateX(-50%);font:400 15px/1 var(--disp);color:#fff3c4;-webkit-text-stroke:1px #8a6a22;text-shadow:0 3px 8px #000;pointer-events:none;animation:fl 1.2s forwards;white-space:nowrap}
.float.bad{color:#ffd6dc;-webkit-text-stroke:1px #a3001a}
.breaklab{z-index:48;padding:5px 12px;border-radius:6px;background:linear-gradient(90deg,#ffd36b,#ff9ccf);color:#2a0d1c;font:400 13px/1 var(--disp);white-space:nowrap;box-shadow:0 0 18px #ffd36b88}
.finish{left:50%;top:46%;z-index:53;font:400 64px/1 var(--disp);letter-spacing:.04em;color:#fff;-webkit-text-stroke:2px #e0398f;text-shadow:0 0 30px #ff5fb0,0 6px 0 #6b0f3b}
.tbanner{position:fixed;left:0;right:0;top:50%;z-index:47;height:92px;margin-top:-46px;pointer-events:none;overflow:hidden}
.tbanner .bar{position:absolute;inset:14px -10%;transform:skewY(-6deg);background:linear-gradient(90deg,transparent,var(--bc) 15%,var(--bc) 85%,transparent);opacity:.92}
.tbanner .sweep{position:absolute;top:0;bottom:0;width:30%;background:linear-gradient(90deg,transparent,#ffffff66,transparent);transform:skewX(-20deg)}
.tbanner .tt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;transform:skewY(-6deg)}
.tbanner b{font:400 30px/1 var(--disp);color:#fff;letter-spacing:.06em;text-shadow:0 3px 0 #0005}
.tbanner small{margin-top:6px;font:700 11px/1 var(--body);letter-spacing:.3em;color:#ffffffcc}

/* ---------- effects ---------- */
.reveal{position:fixed;inset:0;z-index:48;display:grid;place-items:center;background:radial-gradient(60% 45% at 50% 48%,#00000055,#000000c4);animation:fade .2s both}
.reveal .rw{position:relative;display:flex;flex-direction:column;align-items:center;gap:10px}
.reveal .lab{font:400 17px/1 var(--disp);letter-spacing:.12em;color:#fff;padding:8px 18px;border-radius:999px;background:#0d0d14e6;border:1px solid var(--line)}
.reveal .lab.trap{border-color:var(--trap);color:#e9e0ff;box-shadow:0 0 22px #a98bff66}
.reveal .lab.spell{border-color:var(--spell);color:#dcffee;box-shadow:0 0 22px #5ee39a55}
.reveal .lab.sum{border-color:var(--gold);color:#fff3c4;box-shadow:0 0 22px #e2bd6266}
.reveal .lab.gt{border-color:#ff7fae;color:#ffe0ec;box-shadow:0 0 22px #ff7fae66}
.reveal .who{font-size:12px;color:#c9c7d4}
.reveal .bc{width:min(54vw,206px);animation:rin .45s cubic-bezier(.2,1.3,.4,1) both;box-shadow:0 0 0 2px #fff3,0 0 60px color-mix(in srgb,var(--dc) 60%,transparent),0 30px 60px #000c}
.reveal .rays{position:absolute;left:50%;top:50%;width:520px;height:520px;margin:-260px 0 0 -260px;background:repeating-conic-gradient(from 0deg,color-mix(in srgb,var(--rc,#e2bd62) 30%,transparent) 0 6deg,transparent 6deg 18deg);border-radius:50%;mask:radial-gradient(circle,#000 20%,transparent 65%);-webkit-mask:radial-gradient(circle,#000 20%,transparent 65%);animation:spin 6s linear infinite,fade .3s both;z-index:-1}
.reveal .tap{font-size:11px;color:#8f8d9c}
.reveal .rtx{max-width:min(86vw,330px);font-size:13.5px;line-height:1.55;text-align:center;color:#fff;background:#0d0d14e6;border:1px solid var(--line);border-radius:14px;padding:10px 14px;white-space:pre-line}
@keyframes rin{0%{transform:scale(.4) rotateY(80deg);opacity:0}100%{transform:none;opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fade{from{opacity:0}}
.toast{position:fixed;left:50%;top:44%;z-index:49;transform:translate(-50%,-50%);pointer-events:none;font:400 14px/1 var(--disp);letter-spacing:.06em;padding:10px 18px;border-radius:999px;background:#0d0d14ee;border:1px solid var(--line);white-space:nowrap;animation:fade .2s}
.banner{position:fixed;left:0;right:0;top:44%;z-index:47;height:64px;display:grid;place-items:center;align-content:center;pointer-events:none;background:linear-gradient(90deg,transparent,#0d0d14ee 18%,#0d0d14ee 82%,transparent);border-block:1px solid #e2bd6266;animation:band 1.1s cubic-bezier(.3,.8,.3,1) both}
.banner b{font:400 26px/1 var(--disp);letter-spacing:.12em;background:linear-gradient(180deg,#fff6d8,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.banner.opp b{background:linear-gradient(180deg,#ffd6dc,#ff6b7a);-webkit-background-clip:text;background-clip:text}
.banner small{display:block;text-align:center;font:700 10px/1 var(--body);letter-spacing:.4em;color:var(--mut);margin-top:6px}
@keyframes band{0%{transform:scaleY(0);opacity:0}15%{transform:none;opacity:1}80%{opacity:1}100%{opacity:0}}
.vs{position:fixed;left:50%;top:50%;z-index:47;transform:translate(-50%,-50%);pointer-events:none;display:flex;flex-direction:column;gap:6px;align-items:stretch;min-width:250px;padding:12px 14px;border-radius:16px;background:#0d0d14f2;border:1px solid #ffffff22;box-shadow:0 20px 50px #000c;animation:vsin .25s cubic-bezier(.2,1.3,.4,1) both}
@keyframes vsin{from{transform:translate(-50%,-50%) scale(.7);opacity:0}}
.vs .row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;font-size:11px;color:var(--mut)}
.vs .row .l{text-align:right}.vs .row .r{text-align:left}
.vs .n{font:400 22px/1 var(--disp);color:#fff;font-variant-numeric:tabular-nums}
.vs .n.a{color:#ffb08a}.vs .n.d{color:#9fd0ff}
.vs .op{font:400 18px/1 var(--disp);color:#fff}
.vs .res{text-align:center;font:400 14px/1.2 var(--disp);letter-spacing:.06em}
.vs .res.win{color:var(--gold)}.vs .res.lose{color:#ff8a96}.vs .res.mut{color:var(--mut)}
.vs .hd{text-align:center;font-size:11px;color:#c9c7d4}
.burst{position:fixed;z-index:46;pointer-events:none;border-radius:50%;transform:translate(-50%,-50%)}
.flash{position:fixed;inset:0;z-index:44;pointer-events:none;background:#fff;animation:flash .3s forwards}
@keyframes flash{from{opacity:.4}to{opacity:0}}
.shard{position:fixed;z-index:46;pointer-events:none;width:10px;height:14px;background:var(--c,#fff);clip-path:polygon(50% 0,100% 40%,70% 100%,10% 80%)}
.ghost{position:fixed!important;z-index:46;pointer-events:none;margin:0!important}
.coinm{position:fixed;left:50%;top:40%;z-index:49;width:76px;height:76px;margin:-38px 0 0 -38px;transform-style:preserve-3d;pointer-events:none}
.coinm i{font:400 28px/1 var(--disp);box-shadow:inset 0 0 0 3px #f6dd95}
.coinr{position:fixed;left:50%;top:calc(40% + 56px);z-index:49;transform:translateX(-50%);font:400 15px/1 var(--disp);padding:8px 14px;border-radius:999px;background:#0d0d14ee;border:1px solid var(--line);pointer-events:none;white-space:nowrap}
.cutin{position:fixed;inset:0;z-index:52;pointer-events:none;overflow:hidden}
.cutin .dim{position:absolute;inset:0;background:#000a;animation:fade .2s both}
.cutin .band{position:absolute;left:-10%;right:-10%;top:30%;height:40%;transform:skewY(-8deg);background:linear-gradient(90deg,color-mix(in srgb,var(--dc) 70%,#000),var(--dc) 40%,color-mix(in srgb,var(--dc) 50%,#fff) 60%,color-mix(in srgb,var(--dc) 70%,#000));box-shadow:0 0 0 2px #fff6,0 0 60px var(--dc);animation:cband .5s cubic-bezier(.2,.9,.3,1) both;overflow:hidden}
.cutin .lines{position:absolute;inset:0;background:repeating-linear-gradient(90deg,#ffffff00 0 22px,#ffffff30 22px 24px);animation:lines .35s linear infinite}
@keyframes lines{to{background-position:46px 0}}
@keyframes cband{from{transform:skewY(-8deg) translateX(-110%)}}
.cutin .face{position:absolute;right:4%;top:50%;width:46%;max-width:240px;aspect-ratio:1;transform:translateY(-50%) skewY(8deg);border-radius:18px;overflow:hidden;box-shadow:0 0 0 3px #fff,0 20px 40px #000a;animation:cface .55s .1s cubic-bezier(.2,1.2,.3,1) both}
.cutin .face svg{width:100%;height:100%}
@keyframes cface{from{transform:translate(60%,-50%) skewY(8deg);opacity:0}}
.cutin .tx{position:absolute;left:6%;top:50%;transform:translateY(-50%) skewY(8deg);max-width:50%;animation:ctx .5s .18s cubic-bezier(.2,1.2,.3,1) both}
.cutin .tx small{display:block;font:800 11px/1 var(--body);letter-spacing:.3em;color:#fff;opacity:.85;margin-bottom:8px}
.cutin .tx b{display:block;font:400 30px/1.1 var(--disp);color:#fff;text-shadow:0 3px 0 #0006,0 0 20px #0008}
.cutin .tx span{display:block;margin-top:8px;font-size:11.5px;line-height:1.45;color:#fff;text-shadow:0 1px 3px #000}
@keyframes ctx{from{transform:translate(-40%,-50%) skewY(8deg);opacity:0}}
.sheetw{position:fixed;inset:0;z-index:55;background:#000a;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{width:min(100%,520px);background:var(--panel);border-radius:22px 22px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;animation:up .28s cubic-bezier(.2,.9,.3,1);max-height:88%;overflow-y:auto}
@keyframes up{from{transform:translateY(100%)}}
.sheet .top{display:flex;gap:14px;align-items:flex-start}
.sheet .top .bc{width:min(44vw,170px);flex:none}
.sheet h3{margin:0;font:400 20px/1.25 var(--disp)}
.sheet .meta{color:var(--mut);font-size:12px}
.sheet .eff{font-size:14px;line-height:1.6;margin-top:6px;white-space:pre-line}
.sheet .kwx{font-size:12px;color:#cfcdd9;background:#ffffff08;border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.sheet .acts{display:flex;gap:8px;flex-wrap:wrap}
.sheet .acts .btn{flex:1}
.sheet .why{font-size:12px;color:#ffb0b8}
.prompt .cd{height:4px;border-radius:2px;background:#262634;overflow:hidden}
.prompt .cd i{display:block;height:100%;background:var(--trap);transform-origin:left;animation:cd linear forwards}
@keyframes cd{to{transform:scaleX(0)}}
.prompt .ctx{font-size:13px;color:#e9e0ff;background:#a98bff14;border:1px solid #a98bff44;border-radius:12px;padding:10px 12px;line-height:1.55}
.prompt .opts{display:flex;gap:10px;overflow-x:auto}
.prompt .opts .bc{width:110px;flex:none}
.log{font-size:13px;display:flex;flex-direction:column;gap:6px}
.log div{padding:6px 10px;border-radius:10px;background:#ffffff08}
.log div.me{border-left:3px solid var(--ok)}.log div.op{border-left:3px solid var(--bad)}
.help{font-size:13px;line-height:1.6}
.help h4{margin:12px 0 2px;font-size:13px;color:var(--gold)}
.help p{margin:0;color:#d6d4e0}
.ovl{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:#05050acc;padding:24px 16px;animation:fade .3s}
.ovl .box{width:min(100%,360px);background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:24px 20px;display:flex;flex-direction:column;gap:12px;text-align:center}
.ovl h2{margin:0;font:400 44px/1.1 var(--disp)}
.ovl h2.win{background:linear-gradient(180deg,#fff6d8,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.ovl h2.lose{color:#9aa0b4}
.ovl .why{color:var(--mut);font-size:13px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition:none!important}}
/* ---------- v4: life, 4 slots, stars, raising ---------- */
.field{grid-template-columns:repeat(4,1fr);grid-template-rows:1fr 22px 1fr;gap:4px 4px}
.midl{grid-column:1/-1;position:relative;align-self:center;height:1px;background:linear-gradient(90deg,transparent,#ff5fb055 20%,#49e6ff55 80%,transparent)}
.life{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:3px 6px;border-radius:10px;flex:none;min-width:74px;position:relative}
.life small{font:700 9px/1 var(--body);color:#a9a5c6;letter-spacing:.08em}
.life b{font:400 20px/1 var(--disp);font-variant-numeric:tabular-nums;color:#fff}
.life .lbar{display:block;width:70px;height:4px;border-radius:2px;background:#2b2747;overflow:hidden}
.life .lbar i{display:block;height:100%;background:linear-gradient(90deg,#49e6ff,#8affc8);transition:width .5s}
.life.low b{color:#ff8aa6}.life.low .lbar i{background:linear-gradient(90deg,#ff5f86,#ffb08a)}
.life.tgt{box-shadow:0 0 0 2px var(--pink);animation:gpulse 1s infinite}
.life.aim{box-shadow:0 0 0 2.5px var(--pink),0 0 22px #ff5fb0aa}
.float.heal{color:#d6ffe9;-webkit-text-stroke:1px #0b6b3c}
.life .float{top:-6px;font-size:18px}
.tchip span{font:700 9px/1 var(--body);color:#a9a5c6}
.u{box-shadow:var(--under,0 0 0 0 transparent),0 0 0 1.5px color-mix(in srgb,var(--dc) 80%,#fff),0 10px 18px #000b}
.u .stars{position:absolute;top:-1px;left:50%;transform:translate(-50%,-55%);z-index:4;padding:2px 6px;border-radius:999px;background:#0d0a20;border:1px solid #ffd36b66;font-size:10cqw;line-height:1;letter-spacing:.04em;color:#6a6388;white-space:nowrap}
.u .stars.s2{color:#ffd36b}
.u .stars.s3{color:#fff3c4;background:linear-gradient(90deg,#c48a1c,#ffd36b,#c48a1c);border-color:#fff3c4;text-shadow:0 0 4px #fff}
.u .kw{top:7cqw}
.u.awk{box-shadow:var(--under,0 0 0 0 transparent),0 0 0 2px #ffd36b,0 0 18px #ffd36baa,0 0 40px #ffd36b44,0 10px 18px #000b}
.u.awk>.art::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(0deg,#ffd36b33,transparent 60%);mix-blend-mode:screen}
.u .awl{position:absolute;right:3cqw;bottom:46cqw;z-index:3;font:400 9cqw/1 var(--disp);padding:1.5cqw 3cqw;border-radius:3cqw;background:linear-gradient(180deg,#ffe9a8,#c48a1c);color:#2a1d02}
.u.ready.awk{box-shadow:var(--under,0 0 0 0 transparent),0 0 0 2px var(--cyan),0 0 18px #49e6ff88,0 0 30px #ffd36b66}
.lane.pick .u{box-shadow:0 0 0 2.5px #ffd36b,0 0 22px #ffd36baa;animation:pk 1.1s ease-in-out infinite}
.lane.pick::before{background:radial-gradient(60% 60% at 50% 50%,#ffe9a830,transparent 72%);box-shadow:none}
.btn.gold{background:linear-gradient(180deg,#fff3c4,#ffd36b 50%,#c48a1c);color:#2a1d02}
.flash.gold{background:#ffd36b}
.awlab{z-index:49;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 14px;border-radius:12px;background:#17123af2;border:1px solid #ffd36b88;box-shadow:0 0 24px #ffd36b66;white-space:nowrap;max-width:88vw}
.awlab b{font:400 15px/1.1 var(--disp);color:#ffe9a8}
.awlab span{font-size:11.5px;color:#fff;white-space:normal;text-align:center}
.hurt{position:fixed;inset:0;z-index:44;pointer-events:none;box-shadow:inset 0 0 80px 20px #ff1f4a88;animation:flash .5s forwards}
.notice.stack{border-left-color:#ffd36b}
/* ---------- v4b: enemy cards face their owner, trap rows, aces, wider gap ---------- */
.field{grid-template-rows:auto 1fr 56px 1fr auto;gap:4px 4px}
.strow{grid-column:1/-1;display:flex;align-items:center;justify-content:center;gap:8px;padding:2px 0}
.strow .stl{font:700 10px/1 var(--body);color:#b9a8ff;letter-spacing:.06em;margin-right:4px}

.u.awk .face>.art::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(0deg,#ffd36b33,transparent 60%);mix-blend-mode:screen}
.u .face .nmb,.u .face .ust,.u .face .kw,.u .face .stars,.u .face .awl{z-index:3}
.u.ace{box-shadow:var(--under,0 0 0 0 transparent),0 0 0 2px #ffd36b,0 0 0 4px #6b4a0e,0 0 22px #ffd36b88,0 10px 18px #000b}

/* ---------- friend battles: both phones run the same game; only the moves travel ---------- */
let NET=null,Q=[],pumping=false,waitingRemote=false,askRes=null,askQ=0,lastNet=Date.now(),dogT=null;
/* a move of mine: do it here, then tell the other phone */
function X(f,...a){const r=E[f](g,H,...a);if(r!==false&&NET)NET.send({f,a,by:H});return r}
function netAsk(kind,extra){busy=true;render(snap());hint('相手の反応を待っています…');const q=++askQ;NET.send(Object.assign({f:'ask',kind,by:H,q},extra));
  return new Promise(r=>{let fin=false;const t=setTimeout(()=>{if(askRes)askRes(0)},20000);askRes=u=>{if(fin)return;fin=true;clearTimeout(t);askRes=null;hint('');busy=false;r(u||0)}})}
function onNet(m){lastNet=Date.now();Q.push(m);pump()}
function applyMove(m){if(m.f==='endTurn'){E.endTurn(g);if(!g.over)E.startTurn(g);return}
  if(m.f==='resign'){g.over=true;g.win=1-m.by;return}if(m.f==='timeout'){g.over=true;g.win=m.by;return}if(m.f==='ask'||m.f==='ans')return;
  if(E[m.f])E[m.f](g,m.by,...(m.a||[]))}
async function pump(){if(pumping)return;pumping=true;
  try{while(Q.length&&g){const m=Q[0];
    if(m.f==='ans'){Q.shift();if(askRes&&m.q===askQ){const r=askRes;askRes=null;r(m.u)}continue}
    if(m.f==='resign'||m.f==='timeout'){Q.shift();if(g.over)continue;closeSheets();stopTimer();applyMove(m);busy=false;caption(m.f==='resign'?'相手が降参しました':'時間切れで決着');render(snap());finish();continue}
    if(!waitingRemote)break;Q.shift();
    if(m.f==='ask'){await answerAsk(m);continue}
    if(m.f==='endTurn'){waitingRemote=false;clearInterval(dogT);E.endTurn(g);view=snap();busy=false;render(view);if(g.over){finish();continue}setTimeout(beginTurn,D(250));continue}
    g.ev=[];if(E[m.f])E[m.f](g,m.by,...(m.a||[]));const evs=g.ev.splice(0);await step(evs,snap());if(g.over){waitingRemote=false;busy=false;finish()}}}
  finally{pumping=false}}
async function answerAsk(m){const P=g.p[m.by];let ctx,kind=m.kind;if(kind==='spell')ctx={id:P.hand[m.hand]};else ctx={attacker:E.find(g,m.uid),target:m.target};
  const u=E.window(g,kind);let ans=0;if(u.length&&(kind==='spell'||ctx.attacker)){if(kind!=='spell'){const t=m.target==='life'?$('myLife'):uidEl(m.target),ae=uidEl(m.uid);if(ae)ae.classList.add('sel');if(t)t.classList.add('aim');ans=await trapPrompt(kind,ctx,u);settle();if(ae)ae.classList.remove('sel')}else ans=await trapPrompt(kind,ctx,u)}
  NET.send({f:'ans',u:ans,by:H,q:m.q})}

function remoteWait(){waitingRemote=true;busy=true;lastNet=Date.now();render(snap());clearInterval(dogT);
  dogT=setInterval(()=>{if(!waitingRemote||g.over){clearInterval(dogT);return}const s=(Date.now()-lastNet)/1000|0;
    if(s>=90)hint('相手から'+s+'秒応答がありません',[hbtn('勝ちにする','',()=>{if(g.over)return;clearInterval(dogT);NET.send({f:'timeout',by:H});waitingRemote=false;g.over=true;g.win=H;busy=false;hint('');finish()}),hbtn('待つ','sec',()=>{lastNet=Date.now();hint('')})])},1000);

function startPvp(P){NET=P;const other=P.side==='a'?'b':'a',second=P.first==='a'?'b':'a',fd=P.decks[P.first],sd=P.decks[second];

    E.startTurn(g);hist.forEach(applyMove);g.ev=[];view=snap();show('s-game');render(view);if(g.over)return finish();

async function cpuExec(pi,a){if(a.type==='leader')return E.summonLeader(g,pi,a.tribs);if(a.type==='chara')return E.playChara(g,pi,a.hand,a.slot,a.tribs);if(a.type==='evolve')return E.evolve(g,pi,a.hand,a.uid);if(a.type==='set')return E.setTrap(g,pi,a.hand);if(a.type==='skill')return E.skill(g,pi,a.target);
  if(a.type==='spell'){const u=E.window(g,'spell');let ans=0;if(u.length){busy=true;ans=await trapPrompt('spell',{id:g.p[pi].hand[a.hand]},u)}return E.castSpell(g,pi,a.hand,a.target,ans)}
  if(a.type==='attack'){const m=E.find(g,a.uid);const kind=a.target==='life'?'direct':'attack';const u=E.window(g,kind);let ans=0;
    if(u.length){const t=a.target==='life'?$('myLife'):uidEl(a.target);const ae=uidEl(m.uid);if(ae)ae.classList.add('sel');if(t)t.classList.add('aim');ans=await trapPrompt(kind,{attacker:m,target:a.target},u);settle();if(ae)ae.classList.remove('sel')}
    return E.attack(g,pi,a.uid,a.target,ans)}return false}
async function cpuTurn(){const pi=g.cur;let n=0;
  while(!g.over&&n++<40){const a=AI.next(g,pi);if(a.type==='end')break;g.ev=[];const ok=await cpuExec(pi,a);const evs=g.ev.splice(0);if(!ok&&!evs.length)break;await step(evs,snap());await wait(260)}
  if(g.over){busy=false;return finish()}
  await wait(350);E.endTurn(g);view=snap();busy=false;render(view);if(g.over)return finish();beginTurn()}
/* test hook: let the CPU brain play the human side too */
async function autoTurn(){let n=0;while(!g.over&&g.cur===H&&n++<40){const a=AI.next(g,H);if(a.type==='end')break;
  if(a.type==='leader')await act1(()=>X('summonLeader',a.tribs));else if(a.type==='chara')await act1(()=>X('playChara',a.hand,a.slot,a.tribs));else if(a.type==='evolve')await act1(()=>X('evolve',a.hand,a.uid));else if(a.type==='set')await act1(()=>X('setTrap',a.hand));else if(a.type==='skill')await act1(()=>X('skill',a.target));
  else if(a.type==='spell')await castMine(a.hand,a.target);else if(a.type==='attack')await doAttack(a.uid,a.target)}
  if(!g.over)endMyTurn()}
function finish(){if(done)return;done=true;stopTimer();busy=false;closeSheets();render(snap());const w=g.win===-1?'draw':g.win===H?'win':'lose';const e=g.ev.concat(LOG).reverse().find(x=>x.t==='end');
  if(NET){const sideOf=pi=>pi===0?NET.first:(NET.first==='a'?'b':'a');try{NET.claim({win:g.win===-1?'draw':sideOf(g.win),turns:g.turns})}catch(er){}}
  if(HOST){try{HOST.result({w,me:g.p[H].life,cpu:g.p[1-H].life,deck:myDeck.name,cpuName:NET?NET.names[NET.side==='a'?'b':'a']:BY[cpuDeck.lead].n,pvp:!!NET})}catch(er){}}
  const o=el('div','ovl'),b=el('div','box');o.append(b);b.append(el('div',null,myDeck.name+' vs '+cpuDeck.name));
  b.append(el('h2',w==='lose'?'lose':'win',w==='win'?'勝利':w==='lose'?'敗北':'引き分け'),el('div','why',(e&&e.why==='time'?'時間切れ ・ ':'')+'あなたのライフ '+g.p[H].life+' ・ 相手のライフ '+g.p[1-H].life));
  if(NET){const r=el('button','btn','アプリに戻る');r.onclick=()=>HOST.close();const l=el('button','btn sec','流れを見る');l.onclick=logSheet;b.append(r,l)}
  else{const r=el('button','btn','同じデッキでもう一度');r.onclick=()=>{o.remove();startMatch(myDeck)};const d=el('button','btn sec','デッキを選び直す');d.onclick=()=>{o.remove();deckScreen()};const l=el('button','btn sec','流れを見る');l.onclick=logSheet;b.append(r,d,l)}
  setTimeout(()=>document.body.append(o),D(700))}

$('goDeck').onclick=deckScreen;$('goHelp').onclick=helpSheet;
const PVP=HOST&&HOST.pvp?HOST.pvp():null;
if(HOST){document.body.classList.add('inapp');if(PVP)startPvp(PVP);else if(BUILD_ONLY){const v=location.hash.slice(7),L=loadDecks();if(v==='new'||!L[+v])builder(null,-1);else builder(L[+v],+v)}else deckScreen()}
window.__tcg={fxt:{onoma,focusLines,sliceApart,cutin},trapPrompt,leaderSheet,presetOf,builder,redraw:()=>render(snap()),get g(){return g},get H(){return H},get busy(){return busy},get done(){return done},endMyTurn,startMatch,E,AI};
